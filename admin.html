<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard | Glassentials</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

        :root {
            --bg: #0f1117;
            --surface: #1a1d27;
            --surface2: #222536;
            --border: #2e3248;
            --text: #e8eaf0;
            --text-muted: #8b8fa8;
            --accent: #6366f1;
            --accent-light: rgba(99,102,241,0.15);
            --cert: #3b82f6;
            --challan: #f59e0b;
            --quote: #10b981;
            --comp: #a855f7;
        }

        body {
            font-family: 'Inter', sans-serif;
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
        }

        /* ---- SIDEBAR ---- */
        .layout { display: flex; min-height: 100vh; }
        .sidebar {
            width: 240px;
            background: var(--surface);
            border-right: 1px solid var(--border);
            padding: 1.5rem 1rem;
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
            flex-shrink: 0;
        }
        .sidebar-logo {
            font-size: 1.1rem;
            font-weight: 700;
            color: var(--text);
            padding: 0.75rem 0.75rem 1.25rem;
            border-bottom: 1px solid var(--border);
            margin-bottom: 0.5rem;
            display: flex;
            align-items: center;
            gap: 0.6rem;
        }
        .sidebar-logo i { color: var(--accent); }
        .sidebar-link {
            display: flex;
            align-items: center;
            gap: 0.75rem;
            padding: 0.65rem 0.75rem;
            border-radius: 8px;
            color: var(--text-muted);
            text-decoration: none;
            font-size: 0.9rem;
            font-weight: 500;
            transition: background 0.2s, color 0.2s;
        }
        .sidebar-link:hover, .sidebar-link.active {
            background: var(--accent-light);
            color: var(--text);
        }
        .sidebar-link.active { color: #818cf8; }
        .sidebar-link i { width: 18px; text-align: center; }

        /* ---- MAIN ---- */
        .main { flex: 1; padding: 2rem; overflow-x: hidden; }

        .page-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 2rem;
        }
        .page-header h1 {
            font-size: 1.5rem;
            font-weight: 700;
            letter-spacing: -0.02em;
        }
        .page-header h1 span { color: var(--accent); }
        .btn-refresh {
            background: var(--accent);
            color: white;
            border: none;
            padding: 0.55rem 1.1rem;
            border-radius: 8px;
            font-family: inherit;
            font-weight: 600;
            font-size: 0.85rem;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 0.5rem;
            transition: opacity 0.2s;
        }
        .btn-refresh:hover { opacity: 0.85; }

        /* ---- CARDS ---- */
        .cards {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 1rem;
            margin-bottom: 2rem;
        }
        .card {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 1.25rem;
            position: relative;
            overflow: hidden;
        }
        .card::before {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0;
            height: 3px;
        }
        .card.total::before { background: var(--accent); }
        .card.cert::before   { background: var(--cert); }
        .card.challan::before { background: var(--challan); }
        .card.quote::before  { background: var(--quote); }
        .card.comp::before   { background: var(--comp); }

        .card-label {
            font-size: 0.78rem;
            font-weight: 500;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.05em;
            margin-bottom: 0.5rem;
        }
        .card-value {
            font-size: 2rem;
            font-weight: 700;
            line-height: 1;
        }
        .card.total   .card-value { color: #818cf8; }
        .card.cert    .card-value { color: var(--cert); }
        .card.challan .card-value { color: var(--challan); }
        .card.quote   .card-value { color: var(--quote); }
        .card.comp    .card-value { color: var(--comp); }

        .card-icon {
            position: absolute;
            right: 1rem; bottom: 1rem;
            font-size: 2rem;
            opacity: 0.08;
        }

        /* ---- TOOLBAR ---- */
        .toolbar {
            display: flex;
            gap: 0.75rem;
            margin-bottom: 1.25rem;
        }
        .toolbar input, .toolbar select {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 8px;
            color: var(--text);
            padding: 0.6rem 0.9rem;
            font-family: inherit;
            font-size: 0.875rem;
            outline: none;
            transition: border-color 0.2s;
        }
        .toolbar input { flex: 1; }
        .toolbar input:focus, .toolbar select:focus { border-color: var(--accent); }
        .toolbar select option { background: var(--surface2); }

        /* ---- TABLE ---- */
        .table-wrapper {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 12px;
            overflow: hidden;
        }
        table { width: 100%; border-collapse: collapse; }
        thead { background: var(--surface2); }
        th {
            padding: 0.85rem 1rem;
            text-align: left;
            font-size: 0.78rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.06em;
            color: var(--text-muted);
            cursor: pointer;
            user-select: none;
            white-space: nowrap;
        }
        th:hover { color: var(--text); }
        td {
            padding: 0.85rem 1rem;
            font-size: 0.875rem;
            border-top: 1px solid var(--border);
            vertical-align: middle;
        }
        tbody tr:hover { background: var(--surface2); }

        .badge {
            display: inline-flex;
            align-items: center;
            gap: 0.35rem;
            padding: 0.3rem 0.7rem;
            border-radius: 999px;
            font-size: 0.78rem;
            font-weight: 600;
        }
        .badge-Test-Certificate   { background: rgba(59,130,246,0.15); color: #60a5fa; }
        .badge-Delivery-Challan   { background: rgba(245,158,11,0.15); color: #fbbf24; }
        .badge-Quotation          { background: rgba(16,185,129,0.15); color: #34d399; }
        .badge-Work-Completion    { background: rgba(168,85,247,0.15); color: #c084fc; }

        .btn-view {
            display: inline-flex;
            align-items: center;
            gap: 0.4rem;
            background: var(--accent-light);
            color: #818cf8;
            border: 1px solid rgba(99,102,241,0.3);
            padding: 0.4rem 0.85rem;
            border-radius: 6px;
            font-size: 0.8rem;
            font-weight: 600;
            text-decoration: none;
            transition: background 0.2s;
            white-space: nowrap;
        }
        .btn-view:hover { background: rgba(99,102,241,0.3); }

        .empty-state {
            text-align: center;
            padding: 4rem;
            color: var(--text-muted);
        }
        .empty-state i { font-size: 2.5rem; margin-bottom: 1rem; display: block; }

        @media (max-width: 1200px) {
            .cards { grid-template-columns: repeat(3, 1fr); }
        }
        @media (max-width: 768px) {
            .sidebar { display: none; }
            .cards { grid-template-columns: repeat(2, 1fr); }
        }
    </style>
</head>
<body>
<div class="layout">

    <!-- Sidebar -->
    <nav class="sidebar">
        <div class="sidebar-logo">
            <i class="fa-solid fa-gem"></i>
            Glassentials
        </div>
        <a href="index.html" class="sidebar-link">
            <i class="fa-solid fa-arrow-left"></i> Dashboard
        </a>
        <a href="admin.html" class="sidebar-link active">
            <i class="fa-solid fa-table-list"></i> All Records
        </a>
        <a href="certificate.html" class="sidebar-link">
            <i class="fa-solid fa-certificate"></i> Test Certificate
        </a>
        <a href="challan.html" class="sidebar-link">
            <i class="fa-solid fa-truck"></i> Delivery Challan
        </a>
        <a href="quotation.html" class="sidebar-link">
            <i class="fa-solid fa-file-invoice-dollar"></i> Quotation
        </a>
        <a href="completion.html" class="sidebar-link">
            <i class="fa-solid fa-clipboard-check"></i> Work Completion
        </a>
    </nav>

    <!-- Main Content -->
    <main class="main">
        <div class="page-header">
            <h1>Document <span>Records</span></h1>
            <button id="btn-refresh" class="btn-refresh">
                <i class="fa-solid fa-rotate-right"></i> Refresh
            </button>
        </div>

        <!-- Dashboard Cards -->
        <div class="cards">
            <div class="card total">
                <div class="card-label">Total Documents</div>
                <div class="card-value" id="count-total">—</div>
                <i class="fa-solid fa-layer-group card-icon"></i>
            </div>
            <div class="card cert">
                <div class="card-label">Test Certificates</div>
                <div class="card-value" id="count-cert">—</div>
                <i class="fa-solid fa-certificate card-icon"></i>
            </div>
            <div class="card challan">
                <div class="card-label">Delivery Challans</div>
                <div class="card-value" id="count-challan">—</div>
                <i class="fa-solid fa-truck card-icon"></i>
            </div>
            <div class="card quote">
                <div class="card-label">Quotations</div>
                <div class="card-value" id="count-quote">—</div>
                <i class="fa-solid fa-file-invoice-dollar card-icon"></i>
            </div>
            <div class="card comp">
                <div class="card-label">Work Completions</div>
                <div class="card-value" id="count-comp">—</div>
                <i class="fa-solid fa-clipboard-check card-icon"></i>
            </div>
        </div>

        <!-- Toolbar -->
        <div class="toolbar">
            <input type="text" id="search-input" placeholder="&#xf002;  Search by doc no, customer, employee...">
            <select id="filter-type">
                <option value="All">All Types</option>
                <option value="Test Certificate">Test Certificate</option>
                <option value="Delivery Challan">Delivery Challan</option>
                <option value="Quotation">Quotation</option>
                <option value="Work Completion">Work Completion</option>
            </select>
        </div>

        <!-- Table -->
        <div class="table-wrapper">
            <table>
                <thead>
                    <tr>
                        <th id="sort-date">Created At <i class="fa-solid fa-sort"></i></th>
                        <th>Type</th>
                        <th>Doc No.</th>
                        <th>Customer</th>
                        <th>Employee</th>
                        <th>Doc Date</th>
                        <th>Action</th>
                    </tr>
                </thead>
                <tbody id="records-body">
                    <tr>
                        <td colspan="7" class="empty-state">
                            <i class="fa-solid fa-circle-notch fa-spin"></i>
                            Loading records...
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
    </main>
</div>

<script src="supabase-config.js"></script>
<script src="admin.js"></script>
</body>
</html>
