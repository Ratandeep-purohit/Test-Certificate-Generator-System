<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Glassentials | Document Systems</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: 'Inter', sans-serif;
            background-color: #f8fafc;
            color: #0f172a;
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100vh;
            overflow: hidden;
        }
        .container {
            text-align: center;
            padding: 2rem;
            max-width: 600px;
        }
        .logo {
            font-size: 2rem;
            font-weight: 700;
            margin-bottom: 0.5rem;
            color: #0f172a;
            letter-spacing: -0.02em;
        }
        .subtitle {
            color: #64748b;
            font-size: 1rem;
            margin-bottom: 2rem;
        }
        .button-grid {
            display: flex;
            flex-direction: column;
            gap: 0.75rem;
            align-items: center;
        }
        .btn {
            background-color: #3b82f6;
            color: #ffffff;
            text-decoration: none;
            padding: 0.8rem 2rem;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: 500;
            width: 100%;
            max-width: 250px;
            transition: all 0.2s ease;
            box-shadow: 0 2px 4px rgba(59,130,246,0.25);
        }
        .btn:hover {
            background-color: #2563eb;
            transform: translateY(-2px);
            box-shadow: 0 6px 12px rgba(59,130,246,0.3);
        }
        .btn.admin {
            background-color: #10b981;
            box-shadow: 0 2px 4px rgba(16,185,129,0.25);
            margin-top: 1rem;
        }
        .btn.admin:hover {
            background-color: #059669;
            box-shadow: 0 6px 12px rgba(16,185,129,0.3);
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="logo">Document Hub</div>
        <div class="subtitle">Select a module to get started</div>
        
        <div class="button-grid">
            <a href="certificate.html" class="btn">Test Certificate</a>
            <a href="en356.html" class="btn" style="background-color:#b45309; box-shadow:0 2px 4px rgba(180,83,9,0.25);">EN 356 P6B Certificate</a>
            <a href="challan.html" class="btn">Delivery Challan</a>
            <a href="completion.html" class="btn">Work Completion</a>
            <a href="quotation.html" class="btn">Quotation</a>
            <a href="admin.html" class="btn admin">Admin Panel</a>
        </div>
    </div>
</body>
</html>
